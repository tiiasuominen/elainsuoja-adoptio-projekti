<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaasan Eläinsuoja – Adoptoi ystävä</title>
<style>
  :root {
    --bg: #fff8f0;
    --text: #2d2a32;
    --muted: #6e6a75;
    --accent: #e8743b;
    --accent-d: #c85a24;
    --teal: #2a9d8f;
    --cat: linear-gradient(135deg, #c7b8f5, #8f7fe0);
    --dog: linear-gradient(135deg, #ffd29a, #f59a4a);
    --ok: #2e8b57;
    --bad: #c0392b;
    --shadow: 0 4px 14px rgba(45, 42, 50, .10);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }

  header { background:#fff; border-bottom:3px solid var(--accent); position:sticky; top:0; z-index:10; }
  .nav { max-width:1100px; margin:0 auto; padding:.8rem 1.5rem; display:flex; align-items:center; justify-content:space-between; }
  .nav a { color:var(--accent); text-decoration:none; font-size:1.4rem; font-weight:800; }
  .nav span { color:var(--muted); font-size:.9rem; }

  main { max-width:1100px; margin:0 auto; padding:1.5rem; }
  h1 { margin-top:0; }

  .hero { background:linear-gradient(120deg, var(--accent), #f4a259 60%, #f6c177); color:#fff; border-radius:18px; padding:2rem 1.8rem; margin-bottom:1.5rem; box-shadow:var(--shadow); }
  .hero h1 { margin:0 0 .4rem; font-size:2rem; }
  .hero p { margin:0 0 1.2rem; font-size:1.05rem; opacity:.95; }
  .stats { display:flex; gap:.8rem; flex-wrap:wrap; }
  .stat { background:rgba(255,255,255,.22); border-radius:12px; padding:.5rem 1rem; }
  .stat b { font-size:1.4rem; display:block; }
  .stat small { opacity:.9; }

  .controls { display:flex; gap:.8rem; flex-wrap:wrap; align-items:center; margin-bottom:1.2rem; }
  .controls input[type=search], .controls select { padding:.6rem .9rem; border:1px solid #ddd; border-radius:10px; font:inherit; background:#fff; }
  .controls input[type=search] { flex:1; min-width:200px; }
  .filters { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1.2rem; }
  .chip { border:2px solid var(--accent); background:#fff; color:var(--accent); padding:.4rem 1rem; border-radius:999px; cursor:pointer; font-size:1rem; font-weight:600; }
  .chip.active { background:var(--accent); color:#fff; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:1.3rem; }
  .card { background:#fff; border-radius:16px; overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; transition:transform .15s, box-shadow .15s; position:relative; }
  .card:hover { transform:translateY(-4px); box-shadow:0 10px 24px rgba(45,42,50,.16); }
  .card.gone { opacity:.65; }
  .card img, .ph { width:100%; height:180px; object-fit:cover; display:block; }
  .ph { display:flex; align-items:center; justify-content:center; font-size:4.5rem; }
  .ph.kissa { background:var(--cat); }
  .ph.koira { background:var(--dog); }
  .card-body { padding:1rem; display:flex; flex-direction:column; gap:.45rem; flex:1; }
  .card h2 { margin:0; font-size:1.25rem; }
  .meta { color:var(--muted); }
  .badge { display:inline-block; font-size:.8rem; font-weight:700; padding:.2rem .7rem; border-radius:999px; align-self:flex-start; }
  .badge.free { background:#d8f3e4; color:var(--ok); }
  .badge.gone { background:#e5e2ea; color:#666; }
  .heart { position:absolute; top:.6rem; right:.6rem; background:rgba(255,255,255,.9); border:0; border-radius:50%; width:2.4rem; height:2.4rem; font-size:1.3rem; cursor:pointer; color:#999; box-shadow:var(--shadow); }
  .heart.on { color:#e0245e; }

  .btn { display:inline-block; text-align:center; background:var(--accent); color:#fff; border:0; padding:.75rem 1.3rem; border-radius:10px; text-decoration:none; font-size:1rem; font-weight:700; cursor:pointer; margin-top:auto; }
  .btn:hover { background:var(--accent-d); }
  .btn:disabled { background:#bbb; cursor:not-allowed; }

  .detail { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; }
  @media (max-width:700px) { .detail { grid-template-columns:1fr; } .hero h1 { font-size:1.6rem; } }
  .detail img, .detail .ph { border-radius:16px; height:340px; }
  .panel { background:#fff; border-radius:16px; padding:1.4rem; box-shadow:var(--shadow); }
  .tags { display:flex; gap:.5rem; flex-wrap:wrap; margin:.6rem 0 1rem; }
  .tag { background:#fdebdd; color:var(--accent-d); border-radius:999px; padding:.25rem .8rem; font-weight:600; font-size:.9rem; }
  label { display:block; margin:.8rem 0 .25rem; font-weight:600; }
  input, textarea { width:100%; padding:.65rem; border:1px solid #ccc; border-radius:10px; font:inherit; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--teal); border-color:var(--teal); }
  .error { color:var(--bad); margin-top:.7rem; font-weight:600; }
  .thanks { text-align:center; padding:3rem 1rem; }
  .thanks .big { font-size:4.5rem; }
  .muted { color:var(--muted); }
  .empty { text-align:center; padding:2rem; color:var(--muted); grid-column:1/-1; }
  footer { text-align:center; color:var(--muted); padding:2rem 1rem; font-size:.9rem; }
</style>
</head>
<body>
<header><div class="nav"><a href="#/">🐾 Vaasan Eläinsuoja ry</a><span>Löydä uusi ystävä</span></div></header>
<main id="app">Ladataan…</main>
<footer>Vaasan Eläinsuoja ry · Adoptiojärjestelmä</footer>

<script>
const API = '/api';

// Pixabay API-avain
// Hae avain: https://pixabay.com/api/docs/
const PIXABAY_API_KEY = '58664089-e0f697d2816804e9a2063c59b';

// Eläinrotujen englanninkieliset hakusanat Pixabayta varten
const breedQueries = {
  'Maatiaiskissa': 'domestic shorthair cat',
  'Sheltti': 'Shetland sheepdog',
  'Plotti': 'Plott hound',
  'Amerikankettukoira': 'American foxhound hunting dog',
  'Drever': 'Drever dog',
  'Norjanmetsäkissa': 'Norwegian forest cat',
  'Venäjänsininen': 'Russian blue cat',
  'Persialainen': 'Persian cat',
  'Siamilainen': 'Siamese cat',
};

const breedImageCache = new Map();

// Haetaan Pixabaysta kuva rodun perusteella
async function getPixabayImage(breed, type) {
  const query = breedQueries[breed] ||
    (type === 'kissa' ? 'domestic cat' : 'dog');

  if (breedImageCache.has(query)) {
    return breedImageCache.get(query);
  }

  if (!PIXABAY_API_KEY ||
      PIXABAY_API_KEY === 'LISAA_OMA_PIXABAY_API_AVAIN') {
    return null;
  }

  try {
    const url = `https://pixabay.com/api/?key=${PIXABAY_API_KEY}&q=${encodeURIComponent(query)}&image_type=photo&safesearch=true&per_page=5`;

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error('Pixabay-kuvahaku epäonnistui');
    }

    const data = await response.json();
    const image = data.hits?.[0]?.webformatURL || null;

    breedImageCache.set(query, image);
    return image;

  } catch (error) {
    console.warn('Kuvan hakeminen epäonnistui:', error);
    return null;
  }
}

// Haetaan kuvat kaikille eläimille
async function addBreedImages(list) {
  await Promise.all(list.map(async animal => {
    if (!animal.image_url) {
      animal.image_url = await getPixabayImage(
        animal.breed,
        animal.type
      );
    }
  }));
}

const app = document.getElementById('app');
const emoji = t => (t === 'kissa' ? '🐱' : '🐶');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ageText = a => (a === 0 ? 'alle 1 v' : `${a} v`);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// Suosikkiominaisuus
function loadFavs() {
  try {
    return new Set(JSON.parse(localStorage.getItem('favs') || '[]'));
  } catch {
    return new Set();
  }
}

function saveFavs() {
  try {
    localStorage.setItem('favs', JSON.stringify([...favs]));
  } catch {}
}

const favs = loadFavs();

// Kuvat/emojit
function imgHtml(a) {
  if (!a.image_url) {
    return `<div class="ph ${esc(a.type)}">${emoji(a.type)}</div>`;
  }

  return `<img src="${esc(a.image_url)}" alt="${esc(a.name)}" data-type="${esc(a.type)}" onerror="showPlaceholder(this)">`;
}

function showPlaceholder(img) {
  const div = document.createElement('div');
  div.className = 'ph ' + img.dataset.type;
  div.textContent = emoji(img.dataset.type);
  img.replaceWith(div);
}

async function api(path, opts) {
  const res = await fetch(API + path, opts);
  const data = await res.json().catch(() => ({}));

  if (!res.ok) {
    throw new Error(data.error || 'Tuntematon virhe');
  }

  return data;
}

// Etusivu
let animals = [];
let filter = 'kaikki';
let search = '';
let sort = 'nimi';

function visibleAnimals() {
  const q = search.trim().toLowerCase();

  let list = animals.filter(a => {
    if (filter === 'kissa' || filter === 'koira') {
      if (a.type !== filter) return false;
    }

    if (filter === 'suosikit' && !favs.has(a.id)) {
      return false;
    }

    if (q && !(`${a.name} ${a.breed || ''}`.toLowerCase().includes(q))) {
      return false;
    }

    return true;
  });

  if (sort === 'nimi') {
    list.sort((x, y) => x.name.localeCompare(y.name, 'fi'));
  }

  if (sort === 'nuorin') {
    list.sort((x, y) => x.age - y.age);
  }

  if (sort === 'vanhin') {
    list.sort((x, y) => y.age - x.age);
  }

  return list;
}

function drawGrid() {
  const grid = document.getElementById('grid');
  const list = visibleAnimals();

  document.getElementById('favchip').textContent =
    `♥ Suosikit (${favs.size})`;

  grid.innerHTML = list.map(a => {
    const gone = a.status !== 'available';

    return `
    <div class="card ${gone ? 'gone' : ''}">
      <button class="heart ${favs.has(a.id) ? 'on' : ''}" data-id="${a.id}" aria-label="Suosikki">${favs.has(a.id) ? '♥' : '♡'}</button>
      ${imgHtml(a)}
      <div class="card-body">
        <h2>${esc(a.name)}</h2>
        <div class="meta">${esc(cap(a.type))} · ${ageText(a.age)}</div>
        <span class="badge ${gone ? 'gone' : 'free'}">${gone ? 'Adoptoitu' : 'Etsii kotia'}</span>
        <a class="btn" href="#/animal/${a.id}">Katso lisää</a>
      </div>
    </div>`;
  }).join('') || '<div class="empty">Ei hakua vastaavia eläimiä.</div>';

  grid.querySelectorAll('.heart').forEach(b => b.onclick = () => {
    const id = Number(b.dataset.id);

    favs.has(id) ? favs.delete(id) : favs.add(id);

    saveFavs();
    drawGrid();
  });
}

async function renderList() {
  app.innerHTML = 'Ladataan…';

  try {
    animals = await api('/animals');

    // Haetaan Pixabay-kuvat ennen korttien näyttämistä
    await addBreedImages(animals);

    const free = animals.filter(a => a.status === 'available');
    const adopted = animals.filter(a => a.status === 'adopted');

    app.innerHTML = `
      <section class="hero">
        <h1>Löydä uusi paras ystäväsi</h1>
        <p>Tutustu eläimiin, joilla on vielä koti hakusessa, ja jätä adoptiohakemus suoraan täältä.</p>
        <div class="stats">
          <div class="stat"><b>${free.length}</b><small>etsii kotia</small></div>
          <div class="stat"><b>${adopted.length}</b><small>on löytänyt kodin</small></div>
          <div class="stat"><b>${free.filter(a => a.type === 'kissa').length}</b><small>kissaa</small></div>
          <div class="stat"><b>${free.filter(a => a.type === 'koira').length}</b><small>koiraa</small></div>
        </div>
      </section>

      <div class="controls">
        <input type="search" id="search" placeholder="Hae nimellä tai rodulla…" value="${esc(search)}">
        <select id="sort">
          <option value="nimi">Järjestys: nimi A–Ö</option>
          <option value="nuorin">Nuorin ensin</option>
          <option value="vanhin">Vanhin ensin</option>
        </select>
      </div>

      <div class="filters">
        <button class="chip" data-f="kaikki">Kaikki</button>
        <button class="chip" data-f="kissa">🐱 Kissat</button>
        <button class="chip" data-f="koira">🐶 Koirat</button>
        <button class="chip" data-f="suosikit" id="favchip">♥ Suosikit</button>
      </div>

      <div class="grid" id="grid"></div>`;

    document.getElementById('sort').value = sort;

    const setActive = () => app.querySelectorAll('.chip').forEach(c =>
      c.classList.toggle('active', c.dataset.f === filter)
    );

    setActive();

    app.querySelectorAll('.chip').forEach(c => c.onclick = () => {
      filter = c.dataset.f;
      setActive();
      drawGrid();
    });

    document.getElementById('search').oninput = e => {
      search = e.target.value;
      drawGrid();
    };

    document.getElementById('sort').onchange = e => {
      sort = e.target.value;
      drawGrid();
    };

    drawGrid();

  } catch (e) {
    app.innerHTML = `<p class="error">Eläinten lataus epäonnistui: ${esc(e.message)}</p>`;
  }
}

// Yksityiskohtia
async function renderDetail(id) {
  app.innerHTML = 'Ladataan…';

  try {
    const a = await api('/animals/' + id);

    // Haetaan kuva myös eläimen omalle sivulle
    if (!a.image_url) {
      a.image_url = await getPixabayImage(a.breed, a.type);
    }

    const available = a.status === 'available';

    app.innerHTML = `
      <p><a href="#/">← Takaisin listaan</a></p>
      <div class="detail">
        <div>${imgHtml(a)}</div>
        <div class="panel">
          <h1>${esc(a.name)}</h1>
          <div class="tags">
            <span class="tag">${emoji(a.type)} ${esc(cap(a.type))}</span>
            <span class="tag">${ageText(a.age)}</span>
            <span class="tag">${esc(a.breed || 'Rotu ei tiedossa')}</span>
          </div>
          <p>${esc(a.description)}</p>
          <span class="badge ${available ? 'free' : 'gone'}">${available ? 'Etsii kotia' : 'Tämä eläin on jo adoptoitu'}</span>
        </div>
      </div>
      ${available ? `
      <div class="panel" style="margin-top:1.5rem">
        <h2>Haluan adoptoida: ${esc(a.name)}</h2>
        <form id="form">
          <label for="n">Nimi *</label><input id="n" required>
          <label for="e">Sähköposti *</label><input id="e" type="email" required>
          <label for="p">Puhelin</label><input id="p" type="tel">
          <label for="m">Kerro itsestäsi ja kodistasi</label><textarea id="m" rows="4"></textarea>
          <button class="btn" id="send" type="submit" style="margin-top:1rem">Adoptoi minut</button>
          <div class="error" id="err"></div>
        </form>
      </div>` : ''}`;

    const form = document.getElementById('form');

    if (form) form.onsubmit = async ev => {
      ev.preventDefault();

      const btn = document.getElementById('send');
      btn.disabled = true;
      btn.textContent = 'Lähetetään…';

      try {
        const r = await api(`/animals/${id}/adopt`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            applicant_name: document.getElementById('n').value,
            email: document.getElementById('e').value,
            phone: document.getElementById('p').value,
            message: document.getElementById('m').value
          })
        });

        try {
          sessionStorage.setItem('lastAdoption', JSON.stringify(r));
        } catch {}

        location.hash = '#/thanks';

      } catch (e) {
        document.getElementById('err').textContent = e.message;
        btn.disabled = false;
        btn.textContent = 'Adoptoi minut';
      }
    };

  } catch (e) {
    app.innerHTML = `<p class="error">${esc(e.message)}</p><a href="#/">← Takaisin</a>`;
  }
}

// Kiitos
function renderThanks() {
  let r = null;

  try {
    r = JSON.parse(sessionStorage.getItem('lastAdoption') || 'null');
  } catch {}

  app.innerHTML = `
    <div class="thanks panel">
      <div class="big">🎉</div>
      <h1>Kiitos hakemuksestasi!</h1>
      ${r ? `<p>Adoptiohakemuksesi eläimelle <strong>${esc(r.animal_name)}</strong> on vastaanotettu ja tallennettu.</p>
             <p class="muted">Hakemusnumero: #${esc(r.adoption_id)}</p>` : '<p>Hakemus on vastaanotettu.</p>'}
      <p>Otamme sinuun yhteyttä pian.</p>
      <a class="btn" href="#/">Takaisin etusivulle</a>
    </div>`;
}

// Reititys
function route() {
  const h = location.hash || '#/';
  const m = h.match(/^#\/animal\/(\d+)$/);

  if (m) {
    renderDetail(m[1]);
  } else if (h === '#/thanks') {
    renderThanks();
  } else {
    renderList();
  }
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
